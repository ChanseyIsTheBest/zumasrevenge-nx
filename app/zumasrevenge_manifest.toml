# ReXGlue recompilation manifest for Zuma's Revenge! (Xbox Live Arcade, title 584111E9, default.xex).
#
# Run tools/codegen.ps1 (Windows): it calls `rexglue codegen zumasrevenge_manifest.toml` and the post-codegen steps.
# The project name sets the prefix of everything generated: generated/default/zumasrevenge_{init,pch,funcs}.h,
# zumasrevenge_recomp.N.cpp, and the CMake target zumasrevenge_recomp built by CMakeLists.txt.
#
# default.xex (tools/xex_info.py, 2026-10-27): original PE name "Zuma2 Xbox 360.exe", base 0x82000000, entry point
# 0x82304238, XDK 2.0.20871. It imports only xam.xex and xboxkrnl.exe; the game has no other code module. The user's
# package has no title update or DLC.

[project]
name = "zumasrevenge"
sdk_version = "0.10.0"
# Your own game files: the extracted XBLA package (assets/game_root, made by tools/stfs_extract.py), with default.xex
# at its root. Nothing from the game is distributed with this project.
game_root = "../assets/game_root"

[entrypoint]
file_path = "../assets/game_root/default.xex"
out_directory_path = "generated/default"

# The includes are processed before this table, so whatever is set here overrides what is included.
#   overrides.toml       written by hand: code the automatic function discovery misses, each with its evidence
#   perf_overrides.toml  code generation options for speed (registers as C++ locals, ...); the same generated code
#                        serves the PC and the Switch builds.
includes = ["overrides.toml", "perf_overrides.toml"]
